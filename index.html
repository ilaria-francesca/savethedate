<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilaria & Francesca · 3 Settembre 2027</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #fbd1dd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop: card larga fino a 960px per contenere l'immagine orizzontale */
    .card {
      width: 100%;
      max-width: 960px;
    }

    .img-box {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .img-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Default: mostra desktop, nasconde mobile */
    .img-mobile        { display: none; }
    .img-desktop       { display: block; }
    .cal-link-mobile   { display: none; }
    .cal-link-desktop  { display: block; }

    /* Su cellulare: scambia */
    @media (max-width: 600px) {
      .card              { max-width: 100%; }
      .img-desktop       { display: none; }
      .img-mobile        { display: block; }
      .cal-link-desktop  { display: none; }
      .cal-link-mobile   { display: block; }
    }

    /* Link invisibile — base condivisa */
    .cal-link-desktop,
    .cal-link-mobile {
      position: absolute;
      border-radius: 50px;
      cursor: pointer;
      /* Togli il commento sotto per debug (vedi il rettangolo rosso) */
      outline: 2px solid red;
    }

    /* Bottone nel layout DESKTOP (immagine orizzontale):
       pannello destro, in basso al centro del pannello */
    .cal-link-desktop {
      top: 83%;
      left: 75%;
      transform: translateX(-50%);
      width: 24%;
      height: 10%;
    }

    /* Bottone nel layout MOBILE (immagine verticale):
       centrato, quasi in fondo */
    .cal-link-mobile {
      top: 90.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 48%;
      height: 4.2%;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="img-box">

      <img class="img-desktop" src="immagine-desktop.jpg" alt="Save the Date – Ilaria &amp; Francesca">
      <img class="img-mobile"  src="immagine-mobile.jpg"  alt="Save the Date – Ilaria &amp; Francesca">

      <a class="cal-link-desktop" href="matrimonio.ics" aria-label="Segna la data nel calendario"></a>
      <a class="cal-link-mobile"  href="matrimonio.ics" aria-label="Segna la data nel calendario"></a>

    </div>
  </div>

</body>
</html>
