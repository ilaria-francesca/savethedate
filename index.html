<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilaria & Francesca · 3 Settembre 2027</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #fbd1dd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, sans-serif;
    }

    /* Desktop: immagine orizzontale a tutta larghezza */
    .card {
      width: 100%;
      max-width: 100%;
    }

    /* Mobile: limita a larghezza schermo */
    @media (max-width: 600px) {
      .card { max-width: 100%; }
    }

    .img-box {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .img-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Link invisibile sopra il bottone */
    .cal-link {
      position: absolute;
      border-radius: 50px;
      cursor: pointer;

      /* MOBILE — immagine verticale */
      top: 90.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 48%;
      height: 4%;
    }

    /* DESKTOP — immagine orizzontale: bottone in basso nel pannello destro */
    @media (min-width: 601px) {
      .cal-link {
        top: 82%;
        left: 75%;
        width: 20%;
        height: 9%;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="img-box">
      <picture>
        <source media="(min-width: 601px)" srcset="immagine-desktop.jpg">
        <img src="immagine-mobile.jpg" alt="Save the Date – Ilaria &amp; Francesca">
      </picture>

      <a class="cal-link" href="matrimonio.ics" aria-label="Segna la data nel calendario"></a>
    </div>
  </div>

</body>
</html>
