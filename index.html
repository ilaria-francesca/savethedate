<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilaria & Francesca · 3 Settembre 2027</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #2B1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 480px;
    }

    .img-box {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .img-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Nasconde l'immagine mobile di default (desktop) */
    .mobile  { display: none; }
    .desktop { display: block; }

    /* Su cellulare: mostra mobile, nasconde desktop */
    @media (max-width: 600px) {
      .desktop { display: none; }
      .mobile  { display: block; }
      .card { max-width: 100%; }
    }

    /* Link invisibile sopra il bottone — versione DESKTOP */
    .cal-link-desktop {
      position: absolute;
      top: 92.5%;       /* ← aggiusta questo se il bottone non è centrato su pc */
      left: 50%;
      transform: translateX(-50%);
      width: 48%;
      height: 4.2%;
      border-radius: 50px;
      cursor: pointer;
    }

    /* Link invisibile sopra il bottone — versione MOBILE */
    .cal-link-mobile {
      position: absolute;
      top: 92.5%;       /* ← aggiusta questo se il bottone non è centrato su cell */
      left: 50%;
      transform: translateX(-50%);
      width: 48%;
      height: 4.2%;
      border-radius: 50px;
      cursor: pointer;
    }

    /* Mostra/nasconde i link insieme alle immagini */
    .cal-link-mobile  { display: none; }
    .cal-link-desktop { display: block; }

    @media (max-width: 600px) {
      .cal-link-desktop { display: none; }
      .cal-link-mobile  { display: block; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="img-box">

      <!-- Immagine per PC (orizzontale o quadrata) -->
      <img class="desktop" src="immagine-desktop.jpg" alt="Save the Date – Ilaria &amp; Francesca">

      <!-- Immagine per cellulare (verticale) -->
      <img class="mobile" src="immagine-mobile.jpg" alt="Save the Date – Ilaria &amp; Francesca">

      <!-- Link calendario per PC -->
      <a class="cal-link-desktop" href="matrimonio.ics" aria-label="Segna la data nel calendario"></a>

      <!-- Link calendario per cellulare -->
      <a class="cal-link-mobile" href="matrimonio.ics" aria-label="Segna la data nel calendario"></a>

    </div>
  </div>

</body>
</html>
