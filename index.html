<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilaria & Francesca · 3 Settembre 2027</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #2B1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 480px;
    }

    /* Box immagine: position relative per ancorare il link overlay */
    .img-box {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .img-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Link invisibile sovrapposto al bottone "SEGNA LA DATA" nel design */
    .cal-link {
      position: absolute;
      /* Bottone nel design: ~93.8% dall'alto, alto ~3.5%, larghezza ~42% centrata */
      top: 93.8%;
      left: 50%;
      transform: translateX(-50%);
      width: 42%;
      height: 3.5%;
      border-radius: 50px;   /* segue la forma arrotondata del bottone */
      cursor: pointer;
      /* outline visibile solo per debug — togliere in produzione */
      /* outline: 2px solid red; */
    }

    @media (max-width: 500px) {
      .card { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="img-box">
      <img src="immagine.jpg" alt="Save the Date – Ilaria &amp; Francesca">

      <!-- Link trasparente sovrapposto al bottone "SEGNA LA DATA" nel grafico -->
      <a class="cal-link" href="matrimonio.ics" aria-label="Segna la data nel calendario"></a>
    </div>
  </div>

</body>
</html>
